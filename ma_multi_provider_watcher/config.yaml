name: "Music Assistant Multi-Provider Watcher"
description: "Automatically downloads and maintains custom Music Assistant providers (from multiple GitHub repos or local paths) across container restarts and updates."
version: "1.0.0"
slug: ma_multi_provider_watcher
url: "https://github.com/veronoicc/homeassistant-addons/tree/main/ma_multi_provider_watcher"
init: false
boot: auto
docker_api: true
map:
  - share:rw
  - config:rw
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  providers:
    - "https://github.com/sproft/ytmusic-free-provider"
  auto_update: false
  update_interval_hours: 24
schema:
  providers:
    - str
  auto_update: bool
  update_interval_hours: int(1,)
